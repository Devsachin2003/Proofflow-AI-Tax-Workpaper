services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: proofflow
      POSTGRES_PASSWORD: proofflow
      POSTGRES_DB: proofflow
    ports:
      - "5433:5432"
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofflow -d proofflow"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://proofflow:proofflow@db:5432/proofflow
      TEST_DATABASE_URL: postgresql+psycopg://proofflow:proofflow@db:5432/proofflow_test
      PACKET_PATH: /reference/okafor_lindqvist_2025_packet.json
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - ./reference:/reference:ro
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && python -m app.cli import-packet --no-validate && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pgdata:
